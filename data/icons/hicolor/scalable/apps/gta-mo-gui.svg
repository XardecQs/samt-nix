<?xml version="1.0" encoding="UTF-8"?>
<!--
  GTA Mod Organizer icon: three stacked panels (the mod layers that
  fuse-overlayfs composes over the base game), the front one in the app accent.

  Original design for this project. License: GPL-3.0-or-later.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9bff"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none"
        stroke="#007aff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- back layer -->
  <rect x="58" y="58" width="108" height="108" rx="20" fill="#222836"
        stroke="#0e1118" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="74" y="68" width="76" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.10"/>

  <!-- middle layer -->
  <rect x="70" y="70" width="108" height="108" rx="20" fill="#2f3948"
        stroke="#0e1118" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="86" y="80" width="76" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.12"/>

  <!-- front layer (accent) -->
  <rect x="82" y="82" width="108" height="108" rx="20" fill="url(#front)"/>
  <rect x="82" y="82" width="108" height="108" rx="20" fill="none"
        stroke="#0e1118" stroke-opacity="0.30" stroke-width="2"/>
  <rect x="98" y="92" width="76" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.28"/>
</svg>
