[package]
name = "gta-mod-organizer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "gta-mo"

[[bin]]
name = "gta-mo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
owo-colors = "4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
gta-mo-core = { path = "../core" }
